# lychee configuration file

# Root directory to use when checking absolute links in local files.
root_dir = "public"

# Test the specified file extensions for URIs when checking files locally.
extensions = ["html", "ts", "md", "json", "scss", "css", "xlf"]

# Accepted HTTP status codes (include 403 for sites blocking automated checkers)
accept = ["100..=103", "200..=299", "403"]

# Exclude private, link-local, and loopback IPs (localhost, 127.0.0.1, 0.0.0.0)
exclude_all_private = true

# Exclude POST-only REST endpoints, cookie-looping admin URL, and Angular relative/internal paths.
exclude = [
  'https://iamcredentials.googleapis.com/v1/projects/.*', # POST-only IAM template URL
  'https://www.googleapis.com/oauth2/v4/token',           # POST-only OAuth2 token endpoint
  'https://admin.google.com/',                            # Redirects infinitely without Google session cookies
  'assets/.*',                                            # Angular relative asset paths
  'site.webmanifest',                                     # Relative link in index.html
  '/impressum',                                           # Internal route
  '/privacy',                                             # Internal route
  '/research'                                             # Internal route
]

# Exclude paths from getting checked.
exclude_path = [
  'node_modules',
  '.git',
  '.angular',
  'dist',
  'coverage',
  '.firebase',
  '.cypress-cache',
  'functions/node_modules',
  'functions/lib'
]

# Do not show progress bar.
no_progress = true

# Use request cache stored on disk at `.lycheecache`
cache = true

# Maximum number of allowed redirects
max_redirects = 5

# Maximum number of retries per request
max_retries = 3

# Proceed for server connections considered insecure (invalid TLS)
insecure = true

# Skip missing input files
skip_missing = true
