<div
  class="bg-gray-950 p-4 rounded-lg border border-gray-800 h-full print:bg-gray-50 print:border-gray-200 relative overflow-hidden"
>
  <h3 class="text-lg font-semibold text-emerald-400 mb-2 flex items-center gap-2 print:text-emerald-700">
    {{ t('manual.concepts.' + concept + '.title') }}
    @if (concept === 'bio') {
      <div class="h-6 w-10 flex items-center justify-center ml-auto">
        <img src="assets/images/Organic-Logo.svg" alt="EU Organic Logo" class="h-full object-contain" />
      </div>
    }
  </h3>
  <p
    class="text-xs sm:text-sm text-gray-200 leading-relaxed print:text-gray-600"
    [innerHTML]="t('manual.concepts.' + concept + '.text')"
  ></p>
</div>
