<div
  class="h-full w-full border bg-gray-800/80 relative cursor-pointer select-none group border-gray-700/50 transition-all duration-200"
  [class.selected-border]="selected"
  role="button"
  [attr.aria-label]="t(getConfig(parcel.crop).label) + ' field'"
  [attr.aria-pressed]="selected"
>
  <!-- Color Overlay -->
  <div
    class="absolute inset-0 z-10 pointer-events-none transition-colors duration-500"
    [style.background-color]="getOverlayColor()"
  ></div>

  <!-- Background Image -->
  @if (parcel.crop) {
    <img
      [src]="'assets/images/' + getConfig(parcel.crop).image"
      [alt]="t('parcel.crop')"
      draggable="false"
      class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity select-none pointer-events-none"
      onerror="this.style.display = 'none'"
    />
  }

  <!-- Overlays Container -->
  <div class="absolute inset-0 flex flex-col justify-evenly items-center pointer-events-none z-20 py-0.5 px-0.5 overflow-hidden">
    <!-- Text Overlay (Name) -->
    @if (showLabels) {
      <div class="bg-gray-300/90 text-gray-900 text-[clamp(6px,11.5cqw,13px)] leading-tight font-bold px-1 py-px rounded shadow-sm border border-gray-400/50 whitespace-nowrap max-w-full truncate">
        {{ t(getConfig(parcel.crop).label) }}
      </div>
    }

    @if (hasBadRotation) {
      <div
        data-testid="parcel-bad-rotation-badge"
        class="bg-rose-950/95 text-rose-200 text-[clamp(6px,9.5cqw,11px)] leading-tight font-bold px-1.5 py-px rounded shadow-sm border border-rose-500/80 whitespace-nowrap max-w-full truncate"
      >
        Fruchtfolge ▼
      </div>
    }

    @if (showSoil) {
      <div data-testid="parcel-soil-badge" class="bg-amber-900/90 text-white text-[clamp(6px,11.5cqw,13px)] leading-tight font-bold px-1 py-px rounded shadow-sm border border-amber-700/60 whitespace-nowrap">
        {{ parcel.soil }}%
      </div>
    }

    @if (showNutrition) {
      <div class="bg-blue-600/90 text-white text-[clamp(6px,11.5cqw,13px)] leading-tight font-bold px-1 py-px rounded shadow-sm border border-blue-400/50 whitespace-nowrap">
        {{ parcel.nutrition }}%
      </div>
    }

    @if (showHarvest) {
      <div data-testid="parcel-harvest-badge" class="bg-yellow-500/90 text-black text-[clamp(6px,11.5cqw,13px)] leading-tight font-bold px-1 py-px rounded shadow-sm border border-yellow-300 whitespace-nowrap">
        {{ parcel.yield || 0 }} dt ({{ yieldPercentage }}%)
      </div>
    }
  </div>
</div>
